<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Tambah Anggota</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS milik sendiri -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-md">

        <div class="container">

            <a class="navbar-brand fw-semibold" href="../index.html">
                SIMPUS-Mini
            </a>

            <!-- Tombol hamburger Bootstrap -->
            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-controls="navMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu -->
            <nav class="collapse navbar-collapse" id="navMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../buku/list.html">
                            Daftar Buku
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="list.html">
                            Daftar Anggota
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">
                            Tambah Anggota
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- Isi utama -->
    <main class="container my-4">

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="card-title mb-3 fw-bold">
                    Tambah Anggota
                </h2>

                <!-- Form Tambah Anggota -->
                <form id="form-tambah">

                    <!-- Nama -->
                    <div class="mb-3">

                        <label for="nama" class="form-label fw-semibold">
                            Nama
                        </label>

                        <input type="text"
                            class="form-control"
                            id="nama"
                            name="nama"
                            required>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <input type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required>

                    </div>


                    <!-- No. Anggota -->
                    <div class="mb-3">

                        <label for="no_anggota" class="form-label fw-semibold">
                            No. Anggota
                        </label>

                        <input type="text"
                            class="form-control"
                            id="no_anggota"
                            name="no_anggota"
                            required>

                    </div>


                    <!-- Alamat -->
                    <div class="mb-3">

                        <label for="alamat" class="form-label fw-semibold">
                            Alamat
                        </label>

                        <input type="text"
                            class="form-control"
                            id="alamat"
                            name="alamat">

                    </div>


                    <!-- No. HP -->
                    <div class="mb-3">

                        <label for="no_hp" class="form-label fw-semibold">
                            No. HP
                        </label>

                        <input type="text"
                            class="form-control"
                            id="no_hp"
                            name="no_hp">

                    </div>


                    <!-- Tombol Simpan -->
                    <button type="submit" class="btn btn-primary-custom">
                        Simpan
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="text-center text-secondary py-3 small">

        <p class="mb-0">
            &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript milik sendiri -->
    <script src="../assets/js/app.js"></script>

</body>

</html>
