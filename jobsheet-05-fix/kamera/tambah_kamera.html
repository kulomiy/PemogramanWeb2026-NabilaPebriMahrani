<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamRent | Tambah Alat</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <span class="subtitle">SISTEM MANAJEMEN RENTAL</span>
            <h1>CamRent Studio</h1>
        </div>
        <div class="header-right" style="border-left: none; padding-left: 0;">
            <a href="../about.html" class="header-about-btn-large">ABOUT US ↗</a>
        </div>
    </header>

    <nav class="main-nav">
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776; Menu</label>
        <ul>
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="data_kamera.html">Data Kamera</a></li>
            <li><a href="tambah_kamera.html" class="active">Tambah Kamera</a></li>
            <li><a href="../pelanggan/data_pelanggan.html">Data Pelanggan</a></li>
            <li><a href="../pelanggan/tambah_pelanggan.html">Tambah Pelanggan</a></li>
            <li><a href="../login.html">Keluar</a></li>
        </ul>
    </nav>

    <main>
        <section class="content-box">
            <h2 class="section-title">Tambah Data Alat</h2>
            <hr class="divider">
            <form style="max-width: 600px; margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="nama_alat">Nama Alat / Lensa</label>
                    <input type="text" id="nama_alat" name="nama_alat" placeholder="Misal: Alpha A7 Mark III" required>
                </div>
                <div class="form-group">
                    <label for="merek">Merek</label>
                    <input type="text" id="merek" name="merek" placeholder="Misal: Sony, Canon" required>
                </div>
                <div class="form-group">
                    <label for="tahun">Tahun Pembelian</label>
                    <input type="number" id="tahun" name="tahun" min="2010" max="2026" required>
                </div>
                <div class="form-group">
                    <label for="sn">Nomor Seri (SN)</label>
                    <input type="text" id="sn" name="sn" placeholder="Nomor seri unit">
                </div>
                <div class="form-group">
                    <label for="stok">Jumlah Stok</label>
                    <input type="number" id="stok" name="stok" min="0" required>
                </div>
                <div class="form-group">
                    <label for="kategori">Kategori Alat</label>
                    <select id="kategori" name="kategori">
                        <option value="mirrorless">Kamera Mirrorless</option>
                        <option value="dslr">Kamera DSLR</option>
                        <option value="lensa">Lensa</option>
                        <option value="aksesoris">Aksesoris</option>
                    </select>
                </div>
                <button type="submit" style="margin-top: 1rem;">Simpan Data</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CamRent — Sistem Rental Kamera</p>
    </footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
