<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMPUS-Mini | Daftar Buku</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS milik sendiri -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-md">

        <div class="container">

            <a class="navbar-brand fw-semibold" href="../index.html">
                SIMPUS-Mini
            </a>

            <!-- Tombol hamburger -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-controls="navMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menu -->
            <nav class="collapse navbar-collapse" id="navMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="list.html">
                            Daftar Buku
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html">
                            Tambah Buku
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/list.html">
                            Daftar Anggota
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../anggota/tambah.html">
                            Tambah Anggota
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- Isi utama -->
    <main class="container my-4">

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="card-title mb-3 fw-bold">
                    Daftar Buku
                </h2>

                <!-- Pencarian -->
                <div class="search-box mb-4">

                    <label for="search-input" class="form-label fw-semibold">
                        Cari Judul Buku
                    </label>

                    <input
                        type="text"
                        id="search-input"
                        class="form-control"
                        placeholder="Ketik judul buku...">

                </div>


                <!-- Loading -->
                <p id="loading-indicator" class="text-secondary" style="display: none;">
                    Memuat data...
                </p>


                <!-- Tabel -->
                <div class="table-responsive">

                    <table class="table table-striped table-hover align-middle">

                        <thead class="table-header-custom">

                            <tr>
                                <th>Judul</th>
                                <th>Pengarang</th>
                                <th>Tahun</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>

                        </thead>

                        <tbody>
                            <!-- Data buku diisi oleh buku.js -->
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="text-center text-secondary py-3 small">

        <p class="mb-0">
            &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript umum -->
    <script src="../assets/js/app.js"></script>

    <!-- JavaScript khusus buku -->
    <script src="../assets/js/buku.js"></script>

</body>

</html>
